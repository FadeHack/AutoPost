<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ hook|truncate(60) }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% include "_fonts.html" %}
    <style>
      html, body { background: #000; }
    </style>
  </head>
  <body class="m-0 p-0">
    <div class="w-[1200px] h-[1200px] bg-black text-zinc-100 flex flex-col items-center px-24 pt-24 pb-20">

      <!-- Category eyebrow -->
      <div class="sans text-zinc-500 uppercase tracking-widest text-sm self-start">
        {{ category_label }}
      </div>

      <!-- AI image inset (800x800, centered) -->
      <div class="flex-1 flex items-center justify-center w-full my-10">
        <img
          src="{{ image_data_uri }}"
          alt=""
          class="w-[800px] h-[800px] object-cover rounded-md ring-1 ring-zinc-800"
        />
      </div>

      <!-- Brand strap -->
      <div class="self-start">
        <div class="w-16 h-px bg-zinc-600 mb-6"></div>
        <div class="sans text-zinc-400 uppercase tracking-widest text-sm">
          {{ brand_name }}
        </div>
      </div>

    </div>
  </body>
</html>
