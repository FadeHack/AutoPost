<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ hook|truncate(60) }}</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; }
    </style>
  </head>
  <body>
    <!-- Full-bleed AI image: no brand chrome. The Flux image fills the whole
         1200x1200 frame (object-cover) so the shipped post is the raw visual,
         not the minimal-dark brand card. Selected per-render when the operator
         turns the brand frame off. -->
    <img
      src="{{ image_data_uri }}"
      alt=""
      style="display:block; width:1200px; height:1200px; object-fit:cover;"
    />
  </body>
</html>
